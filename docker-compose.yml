services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: growth-os-postgres
    network_mode: bridge
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growth_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: growth-os-redis
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  waha:
    image: devlikeapro/waha
    container_name: growth-os-waha
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_HOOK_URL: http://host.docker.internal:3001/api/webhooks/whatsapp
      WHATSAPP_HOOK_EVENTS: message,session.status
      WAHA_ZIP_LOGS: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: admin
    volumes:
      - wahadata:/app/.sessions

volumes:
  pgdata:
  redisdata:
  wahadata:
