services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arcon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-arcon}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arcon-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcon-web
    restart: unless-stopped
    ports:
      - "80:3030"
      - "3030:3030"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-arcon}
      REDIS_URL: redis://redis:6379
      PORT: 3030
      JWT_SECRET: ${JWT_SECRET:-arcon-super-secure-production-jwt-key-2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ArconAdmin2026!}
      ZOHO_USER: ${ZOHO_USER:-deep@3dices.com}
      ZOHO_PASSWORD: ${ZOHO_PASSWORD}
    volumes:
      - ./packages/database/data:/app/packages/database/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
