name: CI/CD Pipeline - Test & Deploy to AWS

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/test-nova.yml'
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/test-nova.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting AWS OIDC token
  contents: read  # Required for actions/checkout

jobs:
  test:
    name: Run Test Suite & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Dependencies
        run: bun install

      - name: Execute Full Test Suite
        run: bun test

  deploy:
    name: Deploy to AWS EC2 via OIDC
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== Decoded OIDC Token Claims ==="
          echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref}' || echo "Could not decode"

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      - name: Deploy via AWS Systems Manager (SSM Run Command)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=arcon" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "⚠️ Notice: No running EC2 instance found with tags 'App=arcon' and 'Environment=production' in region ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-south-1' }}."
            echo "Once your EC2 instance is launched with tag App=arcon, pushes to main will automatically deploy to it."
            exit 1
          fi

          echo "Target EC2 instance found: $INSTANCE_ID"
          
          # 1. Ensure IAM Instance Profile is attached so SSM Agent can authenticate
          ASSOC_ID=$(aws ec2 describe-iam-instance-profile-associations \
            --filters "Name=instance-id,Values=$INSTANCE_ID" "Name=state,Values=associated" \
            --query "IamInstanceProfileAssociations[0].AssociationId" \
            --output text 2>/dev/null || echo "None")

          if [ "$ASSOC_ID" = "None" ] || [ -z "$ASSOC_ID" ]; then
            echo "No IAM Instance Profile attached to $INSTANCE_ID. Configuring SSM profile..."
            
            PROFILE_NAME="quant-lab-arcon-ec2-profile"
            ROLE_NAME="quant-lab-arcon-ec2-role"
            
            if ! aws iam get-instance-profile --instance-profile-name "$PROFILE_NAME" 2>/dev/null; then
              echo "Creating instance profile $PROFILE_NAME..."
              aws iam create-instance-profile --instance-profile-name "$PROFILE_NAME" || true
              aws iam add-role-to-instance-profile --instance-profile-name "$PROFILE_NAME" --role-name "$ROLE_NAME" || true
              echo "Waiting 10s for IAM profile propagation..."
              sleep 10
            fi
            
            echo "Associating $PROFILE_NAME with $INSTANCE_ID..."
            aws ec2 associate-iam-instance-profile \
              --instance-id "$INSTANCE_ID" \
              --iam-instance-profile Name="$PROFILE_NAME" || true
            
            echo "Associated profile. Waiting 15s for instance metadata update..."
            sleep 15
          else
            echo "IAM Instance Profile already associated: $ASSOC_ID"
          fi

          # 2. Wait for SSM Agent to become Online (up to 90 seconds)
          echo "Waiting for AWS Systems Manager registration..."
          SSM_STATUS="NotRegistered"
          for attempt in {1..18}; do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "NotRegistered")
            
            echo "SSM Agent Status: $SSM_STATUS (attempt $attempt/18)"
            if [ "$SSM_STATUS" = "Online" ]; then
              break
            fi
            sleep 5
          done

          if [ "$SSM_STATUS" != "Online" ]; then
            echo "⚠️ Target EC2 instance ($INSTANCE_ID) is running, but SSM Agent is not yet Online (Status: $SSM_STATUS)."
            echo "=== Fetching EC2 System Console Log ==="
            aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text | tail -n 80 || echo "Console log not yet available"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated CI/CD deployment from GitHub Actions commit ${{ github.sha }}" \
            --parameters 'commands=[
              "set -ex",
              "export HOME=/root",
              "chown -R root:root /opt/arcon || true",
              "git config --system --add safe.directory /opt/arcon || true",
              "cd /opt/arcon",
              "git fetch origin",
              "git checkout '${{ github.ref_name }}'",
              "git reset --hard origin/'${{ github.ref_name }}'",
              "docker compose up -d --build",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched. Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."
          
          for i in {1..70}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Deployment status: $STATUS (check $i/70)"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded!"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text | tail -n 50
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment ended with status: $STATUS"
              echo "=== Standard Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              echo "=== Standard Error ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Deployment timed out waiting for SSM completion."
          exit 1
