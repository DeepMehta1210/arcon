name: CI/CD Pipeline - Test & Deploy to AWS

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/test-nova.yml'
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/test-nova.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting AWS OIDC token
  contents: read  # Required for actions/checkout

jobs:
  test:
    name: Run Test Suite & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Dependencies
        run: bun install

      - name: Execute Full Test Suite
        run: bun test

  deploy:
    name: Deploy to AWS EC2 via OIDC
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== Decoded OIDC Token Claims ==="
          echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref}' || echo "Could not decode"

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      - name: Deploy via AWS Systems Manager (SSM) or EC2 Instance Connect
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=arcon" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "⚠️ Notice: No running EC2 instance found with tags 'App=arcon' and 'Environment=production' in region ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-south-1' }}."
            echo "Once your EC2 instance is launched with tag App=arcon, pushes to main will automatically deploy to it."
            exit 1
          fi

          echo "Target EC2 instance found: $INSTANCE_ID"
          
          # 1. Try attaching an IAM instance profile if none is currently associated
          ASSOC_ID=$(aws ec2 describe-iam-instance-profile-associations \
            --filters "Name=instance-id,Values=$INSTANCE_ID" "Name=state,Values=associated" \
            --query "IamInstanceProfileAssociations[0].AssociationId" \
            --output text 2>/dev/null || echo "None")

          if [ "$ASSOC_ID" = "None" ] || [ -z "$ASSOC_ID" ]; then
            echo "No IAM Instance Profile attached to $INSTANCE_ID. Checking for available profiles..."
            
            EXISTING_PROFILE=$(aws iam list-instance-profiles \
              --query "InstanceProfiles[?contains(InstanceProfileName, 'arcon') || contains(InstanceProfileName, 'quant-lab')].InstanceProfileName | [0]" \
              --output text 2>/dev/null || echo "None")
            
            if [ -n "$EXISTING_PROFILE" ] && [ "$EXISTING_PROFILE" != "None" ]; then
              echo "Found existing instance profile: $EXISTING_PROFILE. Associating with $INSTANCE_ID..."
              aws ec2 associate-iam-instance-profile \
                --instance-id "$INSTANCE_ID" \
                --iam-instance-profile Name="$EXISTING_PROFILE" || true
              sleep 10
            fi
          else
            echo "IAM Instance Profile already associated: $ASSOC_ID"
          fi

          # 2. Check if SSM Agent is Online (polls for up to 30s)
          echo "Checking AWS Systems Manager registration..."
          SSM_STATUS="NotRegistered"
          for attempt in {1..6}; do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "NotRegistered")
            
            echo "SSM Agent Status: $SSM_STATUS (attempt $attempt/6)"
            if [ "$SSM_STATUS" = "Online" ]; then
              break
            fi
            sleep 5
          done

          # 3. If SSM agent hasn't picked up IAM credentials, reboot instance to initialize daemon
          if [ "$SSM_STATUS" != "Online" ]; then
            echo "⚠️ SSM agent did not pick up IAM profile on running instance. Rebooting instance to reload agent credentials..."
            aws ec2 reboot-instances --instance-ids "$INSTANCE_ID" || echo "Instance reboot API call skipped/denied."
            echo "Waiting 40s for instance reboot and daemon initialization..."
            sleep 40

            for attempt in {1..12}; do
              SSM_STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || echo "NotRegistered")
              
              echo "SSM Agent Status post-reboot: $SSM_STATUS (attempt $attempt/12)"
              if [ "$SSM_STATUS" = "Online" ]; then
                break
              fi
              sleep 5
            done
          fi

          if [ "$SSM_STATUS" = "Online" ]; then
            echo "✅ SSM Agent is Online! Deploying via AWS Systems Manager..."
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Automated CI/CD deployment from GitHub Actions commit ${{ github.sha }}" \
              --parameters 'commands=[
                "set -ex",
                "export HOME=/root",
                "chown -R root:root /opt/arcon || true",
                "git config --system --add safe.directory /opt/arcon || true",
                "cd /opt/arcon",
                "git fetch origin",
                "git checkout '${{ github.ref_name }}'",
                "git reset --hard origin/'${{ github.ref_name }}'",
                "docker compose up -d --build",
                "docker image prune -f"
              ]' \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command dispatched. Command ID: $COMMAND_ID"
            echo "Waiting for deployment to complete..."

            for i in {1..70}; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")
              echo "Deployment status: $STATUS (check $i/70)"
              if [ "$STATUS" = "Success" ]; then
                echo "🎉 Deployment succeeded via AWS SSM!"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text | tail -n 50
                exit 0
              elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
                echo "❌ Deployment ended with status: $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
                exit 1
              fi
              sleep 10
            done
            exit 1
          fi

          echo "⚠️ SSM Agent is not Online ($SSM_STATUS). Falling back to EC2 Instance Connect + SSH..."
          
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          AZ=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].Placement.AvailabilityZone" --output text)
          SG_ID=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" --output text)
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          
          echo "Target Public IP: $PUBLIC_IP"
          echo "Availability Zone: $AZ"
          echo "Security Group: $SG_ID"
          echo "Runner IP: $RUNNER_IP"

          # Temporarily authorize Port 22 for this GitHub Runner
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" 2>/dev/null || true

          # Generate temporary SSH key pair
          ssh-keygen -t rsa -b 3072 -f /tmp/arcon_deploy_key -N "" -q

          # Push public key to EC2 Instance Connect
          if aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" \
            --availability-zone "$AZ" \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/arcon_deploy_key.pub; then
            
            echo "Successfully sent SSH public key via EC2 Instance Connect. Connecting..."
            
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i /tmp/arcon_deploy_key ubuntu@"$PUBLIC_IP" \
              "sudo git config --system --add safe.directory /opt/arcon && cd /opt/arcon && sudo git fetch origin && sudo git checkout main && sudo git reset --hard origin/main && sudo docker compose up -d --build && sudo docker image prune -f"

            # Revoke temporary SSH rule
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_IP/32" 2>/dev/null || true
              
            echo "Deployment successfully executed via EC2 Instance Connect!"
            exit 0
          else
            echo "EC2 Instance Connect failed. Revoking SSH ingress..."
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_IP/32" 2>/dev/null || true
          fi

          echo ""
          echo "⚠️ Automated deployment methods could not reach $INSTANCE_ID."
          echo "💡 To permanently enable 1-click deployments:"
          echo "   1. Open AWS EC2 Console -> Instances"
          echo "   2. Select '$INSTANCE_ID' ('arcon-production')"
          echo "   3. Click Actions -> Security -> Modify IAM Role"
          echo "   4. Attach IAM role: 'quant-lab-arcon-ec2-role'"
          echo "   5. Within 60 seconds, future git pushes will auto-deploy via SSM!"
          exit 1
